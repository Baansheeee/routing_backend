# Copy to: /etc/nginx/sites-available/routing
# Then: sudo ln -s /etc/nginx/sites-available/routing /etc/nginx/sites-enabled/
# Replace YOUR_EC2_PUBLIC_IP_OR_DOMAIN below.

server {
    listen 80;
    server_name YOUR_EC2_PUBLIC_IP_OR_DOMAIN;

    client_max_body_size 20M;

    location /static/ {
        alias /home/ubuntu/routing_backend/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/home/ubuntu/routing_backend/gunicorn.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
